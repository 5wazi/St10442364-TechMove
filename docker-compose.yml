version: '3.9'

services:

  # ── Container 1: SQL Server Database ───────────────────────────────────────
  sql-server-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sql-server-db
    environment:
      SA_PASSWORD: "TechMove_SA_Password123!"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - techmove-network
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd",
             "-S", "localhost",
             "-U", "sa",
             "-P", "TechMove_SA_Password123!",
             "-Q", "SELECT 1",
             "-No"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ── Container 2: Web API ────────────────────────────────────────────────────
  glms-backend-api:
    build:
      context: .
      dockerfile: TechMove.Api/Dockerfile
    container_name: glms-backend-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:80
      ConnectionStrings__DefaultConnection: "Server=sql-server-db,1433;Database=TechMoveDB;User Id=sa;Password=TechMove_SA_Password123!;TrustServerCertificate=True;MultipleActiveResultSets=true"
      Jwt__Key: "TechMove_Super_Secret_JWT_Key_2026_Must_Be_At_Least_32_Chars!"
      Jwt__Issuer: "TechMove.Api"
      Jwt__Audience: "TechMove.Web"
      Jwt__ExpiryHours: "8"
      Firebase__ProjectId: "techmove-lms"
      AllowedOrigins: "http://glms-frontend-web:80"
    ports:
      - "5100:80"
    volumes:
      - api_uploads:/app/wwwroot/uploads/agreements
    networks:
      - techmove-network
    depends_on:
      sql-server-db:
        condition: service_healthy
    restart: on-failure

  # ── Container 3: MVC Frontend ───────────────────────────────────────────────
  glms-frontend-web:
    build:
      context: .
      dockerfile: PROG7313_TechMove/Dockerfile
    container_name: glms-frontend-web
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:80
      ApiBaseUrl: "http://glms-backend-api:80"
      Firebase__ApiKey: "AIzaSyDOSzVOKkuuCBWYWJ6w5CjCrb7OO9EnIO4"
      Firebase__ProjectId: "techmove-lms"
      Firebase__AuthDomain: "techmove-lms.firebaseapp.com"
    ports:
      - "5000:80"
    networks:
      - techmove-network
    depends_on:
      - glms-backend-api
    restart: on-failure

# ── Volumes ─────────────────────────────────────────────────────────────────
volumes:
  sqlserver_data:
  api_uploads:

# ── Network ──────────────────────────────────────────────────────────────────
networks:
  techmove-network:
    driver: bridge